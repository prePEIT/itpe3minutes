<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2433;--sub:#6b7385;--line:#e3e6ec;--acc:#1f4fd1;--hl:#ffe58a;--new:#d9480f;--ch:#1f3864}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px 10px;z-index:2}

.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
#chs .chip{border-radius:6px;font-weight:600}#chs .chip.on{background:var(--ch);border-color:var(--ch)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:var(--sub);gap:8px;flex-wrap:wrap}
.bar button{font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 9px;cursor:pointer;color:var(--ink)}
#keybox{margin-top:8px;display:flex;gap:6px}#keybox[hidden]{display:none}#key{flex:1;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;min-width:0}
#keybox button{font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 9px;cursor:pointer}
#st{font-size:12px;margin-top:6px;color:var(--sub)}#st.err{color:#c92a2a}#st.ok{color:#2b8a3e}
main{max-width:980px;margin:0 auto;padding:10px 12px 40px}
.row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.no{color:var(--sub);font-size:12px;min-width:30px;padding-top:2px;text-align:right}
.body{flex:1;min-width:0}.t{font-size:14.5px;line-height:1.45;color:var(--ink);text-decoration:none;word-break:keep-all}.t:hover{color:var(--acc);text-decoration:underline}
.meta{font-size:12px;color:var(--sub);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.tag{background:#eef2fb;color:var(--acc);border-radius:4px;padding:0 6px}.chn{background:#edf0f5;color:var(--ch);border-radius:4px;padding:0 6px}.newb{color:#fff;background:var(--new);border-radius:4px;padding:0 6px}
mark{background:var(--hl);color:inherit;border-radius:2px}
.empty{text-align:center;color:var(--sub);padding:40px 0;line-height:1.6}
@media(max-width:600px){header{padding:10px 10px 8px}h1{font-size:15px;margin-bottom:8px}
.chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto}
.bar{margin-top:8px}.bar>span:last-child{display:flex;gap:4px;overflow-x:auto}.bar button{white-space:nowrap;padding:4px 7px}main{padding:8px 8px 30px}.row{padding:9px 10px}}

 const order=Object.keys(cnt).sort((a,b)=>g(a)-g(b)||(/^\d+회/.test(a)&&/^\d+회/.test(b)?b.localeCompare(a):a.localeCompare(b,'ko')));
 const el=document.getElementById('chips');el.innerHTML='';const nn=L.filter(v=>v.n).length;
 ['전체',...(nn?['NEW']:[]),...(curCh==='all'?[]:order)].forEach(c=>{const b=document.createElement('button');b.className='chip'+(c===cur?' on':'');
 b.textContent=c==='전체'?`분류 전체 ${L.length}`:c==='NEW'?`새로 추가(7일) ${nn}`:`${c} ${cnt[c]}`;b.onclick=()=>{cur=c;drawChips();render()};el.appendChild(b)})}
function render(){const ws=document.getElementById('q').value.trim().split(/\s+/).filter(Boolean);
 const list=items().filter(v=>(cur==='전체'||(cur==='NEW'?v.n:v.c===cur))&&ws.every(w=>norm(v.t).includes(norm(w))));
 document.getElementById('cnt').textContent=`${list.length}개 표시`;
 const re=ws.length?new RegExp('('+ws.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'):null;
 const empty=items().length?'검색 결과가 없어요':'아직 목록이 없어요.<br>[API 키 설정]에 키를 넣으면 이 채널의 최근 3개월 영상을 불러와요.';
 document.getElementById('list').innerHTML=list.length?list.map((v,i)=>{let t=esc(v.t);if(re)t=t.replace(re,'<mark>$1</mark>');
 return`<div class="row"><div class="no">${i+1}</div><div class="body"><a class="t" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">${t}</a>
 <div class="meta">${v.n?'<span class="newb">NEW</span>':''}${curCh==='all'?`<span class="chn">${esc(chOf(v.ch).short)}</span>`:''}<span class="tag">${esc(v.c)}</span><span>${v.p?'업로드 '+kst(v.p):esc(v.d)+(v.w?' ('+esc(v.w)+' 기준 '+esc(v.b||BASE)+')':'')}</span></div></div></div>`}).join(''):`<div class="empty">${empty}</div>`}
document.getElementById('q').addEventListener('input',render);
const st=(m,c)=>{const e=document.getElementById('st');e.textContent=m;e.className=c||''};
async function pidOf(c,key){const ck=LS.get('pid_'+c.k);if(ck)return ck;
 try{const j=await (await fetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&forHandle=${encodeURIComponent(c.h)}&key=${encodeURIComponent(key)}`)).json();
  const u=j.items&&j.items[0]&&j.items[0].contentDetails.relatedPlaylists.uploads;if(u){LS.set('pid_'+c.k,u);return u}}catch(e){}
 return c.pid}
async function syncCh(c,key){const PL=await pidOf(c,key);const known=new Map(c.data.map(v=>[v.id,v]));const empty=!known.size;
 const cutoff=new Date(Date.now()-92*864e5).toISOString();
 const fetched=[];let tok='',pages=0,covered=0;
 do{const u=`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${PL}&key=${encodeURIComponent(key)}`+(tok?`&pageToken=${tok}`:'');
  const j=await (await fetch(u)).json();if(j.error)throw new Error((j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason||'')+' '+j.error.message);
  let hit=false,old=false;for(const it of j.items||[]){const id=it.contentDetails.videoId,t=it.snippet.title;if(/^(Private|Deleted) video$/.test(t))continue;
   const p=it.contentDetails.videoPublishedAt||it.snippet.publishedAt;fetched.push({id,t,p});if(known.has(id)){hit=true;covered++}if(p<cutoff)old=true}
  tok=j.nextPageToken||'';pages++;
  if(empty&&old)break; if(!empty&&c.full&&hit)break; if(!empty&&!c.full&&covered>=known.size)break;
 }while(tok&&pages<60);
 let last=-1;fetched.forEach((f,i)=>{if(known.has(f.id))last=i});if(!empty&&last<0)last=fetched.length-1;
 c.data.forEach(v=>{if(v.n&&Date.now()-v.n>7*864e5)delete v.n});let added=0;
 fetched.forEach((f,i)=>{const v=known.get(f.id);
  if(v){v.p=f.p;v.t=f.t;v.c=cat(f.t,c.k);v.d=f.p.slice(0,10)}
  else if(empty?f.p>=cutoff:i<=last){const nv={id:f.id,t:f.t,p:f.p,d:f.p.slice(0,10)};if(!empty){nv.n=Date.now();added++}nv.c=cat(nv.t,c.k);c.data.push(nv);known.set(f.id,nv)}});
 if(c.data.every(v=>v.p))c.data.sort((a,b)=>b.p.localeCompare(a.p));
 c.full=true;save(c);return empty?`${c.short} ${c.data.length}개 불러옴`:`${c.short} 새 영상 ${added}개`}
async function sync(){const key=LS.get('yt_key');if(!key){st('API 키가 없어요. [API 키 설정]을 눌러 키를 넣어 주세요.','err');return}
 if(!navigator.onLine){st('오프라인 상태예요. 저장된 목록으로 검색만 돼요.');return}
 st('새 영상 확인 중…');const msg=[];let err='';
 for(const c of CH){try{msg.push(await syncCh(c,key))}catch(e){err+=`${c.short} 확인 실패: ${e.message.replace(/<[^>]+>/g,'')} `}}
 const hasNew=items().some(v=>v.n);if(hasNew&&cur==='전체')cur='NEW';drawChs();drawChips();render();
 st(err?err+'(키·인터넷 상태를 확인해 주세요)':`마지막 확인 ${kst(new Date().toISOString())} · ${msg.join(' · ')}`,err?'err':(/새 영상 [1-9]|불러옴/.test(msg.join())?'ok':''))}
document.getElementById('sync').onclick=sync;
document.getElementById('keybtn').onclick=()=>{const b=document.getElementById('keybox');b.hidden=!b.hidden;document.getElementById('key').value=LS.get('yt_key')||''};
document.getElementById('keysave').onclick=()=>{const k=document.getElementById('key').value.trim();if(!k)return;LS.set('yt_key',k);document.getElementById('keybox').hidden=true;sync()};
document.getElementById('keydel').onclick=()=>{LS.del('yt_key');document.getElementById('key').value='';st('API 키를 삭제했어요.')};
document.getElementById('exp').onclick=()=>{const csv='﻿'+[['채널','제목','주소','업로드일','분류'],...items().map(v=>[chOf(v.ch).short,v.t,'https://www.youtube.com/watch?v='+v.id,v.p?kst(v.p):v.d,v.c])].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=(curCh==='all'?'기술사영상_전체':chOf(curCh).short)+'_목록.csv';a.click()};
drawChs();drawChips();render();
if(LS.get('yt_key'))sync();else st('[API 키 설정]에 키를 넣으면 열 때마다 모든 채널의 새 영상이 자동으로 추가돼요.');
</script></body></html>
