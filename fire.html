<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="소방기술사 영상">
<title>소방기술사 유튜브 모아보기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8590c'/%3E%3Cpath d='M33 10c2 9-6 12-6 21 0 4 3 7 6 7-1-5 4-8 4-13 5 4 9 9 9 16a14 14 0 0 1-28 0c0-11 9-17 15-31z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
 --bg:#f5f5f2;--panel:#ffffff;--ink:#17191e;--sub:#6a6f7a;--faint:#9aa0aa;--line:#e6e4df;
 --acc:#e8590c;--acc-ink:#fff;--acc-soft:#fff1e8;--hl:#ffe08a;--ok:#2f9e44;--err:#d6336c;
 --shadow:0 1px 2px rgba(20,20,20,.04),0 4px 16px rgba(20,20,20,.05);--r:14px;
}
@media(prefers-color-scheme:dark){:root{
 --bg:#111317;--panel:#1a1d23;--ink:#eceef2;--sub:#a2a8b3;--faint:#6f7682;--line:#2a2e36;
 --acc:#ff7a2f;--acc-ink:#1a1206;--acc-soft:#2b1d14;--hl:#6b5512;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:200px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:12px;padding:16px 0 12px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.ttl{flex:1;min-width:0}.ttl h1{font-size:17px;margin:0;letter-spacing:-.2px}.ttl p{margin:1px 0 0;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p.err{color:var(--err)}.ttl p.ok{color:var(--ok)}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{border-color:var(--faint)}.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.spin svg{animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:var(--faint);fill:none;stroke-width:2}
#q{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;padding:0 40px 0 40px;outline:none;transition:border-color .15s,box-shadow .15s}
#q:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
#qx{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--faint);font-size:20px;cursor:pointer;display:none;padding:4px 8px}
.row-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 2px;margin:0 -20px;padding-left:20px;padding-right:20px}
.row-scroll::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .n{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}.chip.on .n{color:inherit;opacity:.65}
.chip .dot{width:8px;height:8px;border-radius:50%}
#cats .chip{height:28px;font-size:12.5px;padding:0 10px}
#cats .chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.tools{display:flex;align-items:center;gap:8px;padding:10px 0 12px;font-size:12.5px;color:var(--sub)}
.tools .sp{flex:1}
.tg{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;padding:4px 2px}
.tg input{display:none}.tg i{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .15s}
.tg i:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg input:checked+i{background:var(--acc)}.tg input:checked+i:after{transform:translateX(12px)}
main.wrap{padding-top:6px;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
.sec{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.3px;margin:20px 4px 8px;display:flex;align-items:center;gap:8px}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--faint) 60%,var(--line))}
.th{position:relative;display:block;aspect-ratio:16/9;background:var(--line);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px;font-variant-numeric:tabular-nums}
.newb{position:absolute;left:8px;top:8px;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.4px}
.cb{padding:11px 13px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.t{color:var(--ink);text-decoration:none;font-size:14.5px;font-weight:600;line-height:1.42;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.t:hover{color:var(--acc)}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:auto}
.ch{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink)}.ch .dot{width:7px;height:7px;border-radius:50%}
.cat{background:var(--acc-soft);color:var(--acc);border-radius:5px;padding:0 6px;font-weight:600}
.seen{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer;opacity:.85}
.seen svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.card.is-seen .th img{filter:grayscale(.6) brightness(.8)}.card.is-seen .t{color:var(--sub)}
.card.is-seen .seen{background:var(--ok);opacity:1}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--sub);padding:70px 20px;line-height:1.7}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.more{display:block;margin:18px auto 0;height:40px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13.5px}
/* list view */
body.list .grid{grid-template-columns:1fr;gap:8px}
body.list .card{flex-direction:row}
body.list .th{width:176px;flex:none;aspect-ratio:16/9;align-self:flex-start;margin:10px 0 10px 10px;border-radius:9px}
body.list .cb{padding:10px 12px}
body.list .seen{width:26px;height:26px;right:auto;left:150px;top:14px}
/* settings sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 32px));background:var(--panel);border-radius:18px;z-index:21;padding:20px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet.open,.sheet-bg.open{display:block}
.sheet h2{font-size:16px;margin:0 0 4px}.sheet p{font-size:12.5px;color:var(--sub);margin:0 0 12px}
.sheet label{font-size:12.5px;font-weight:600;display:block;margin:14px 0 6px}
.sheet input[type=text]{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font-size:14px;outline:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.btn.dan{color:var(--err)}
@media(max-width:640px){
 .wrap{padding:0 14px}.row-scroll{margin:0 -14px;padding-left:14px;padding-right:14px}
 .top{padding:12px 0 10px}.ttl h1{font-size:16px}
 .grid{grid-template-columns:1fr;gap:10px}
 body:not(.grid-force) .card{flex-direction:row;border-radius:12px}
 body:not(.grid-force) .th{width:132px;flex:none;margin:9px 0 9px 9px;border-radius:8px;align-self:flex-start}
 body:not(.grid-force) .cb{padding:8px 10px 9px;gap:5px}
 body:not(.grid-force) .t{font-size:13.5px}
 body:not(.grid-force) .seen{width:24px;height:24px;right:auto;left:111px;top:12px}
 body:not(.grid-force) .seen svg{width:13px;height:13px}
 body:not(.grid-force) .newb{left:13px;top:13px;font-size:10px;padding:1px 5px}
 #viewbtn{display:none}
}
</style></head>
<body>
<header><div class="wrap">
 <div class="top">
  <div class="logo"><svg viewBox="0 0 64 64"><path d="M33 8c2 10-7 13-7 23 0 4 3 8 7 8-1-6 4-9 4-15 6 5 10 10 10 18a15 15 0 0 1-30 0c0-12 10-19 16-34z" fill="#fff"/></svg></div>
  <div class="ttl"><h1>소방기술사 유튜브 모아보기</h1><p id="st">불러오는 중…</p></div>
  <button class="ib" id="viewbtn" title="카드/목록 보기"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
  <button class="ib" id="syncbtn" title="새 영상 확인"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button>
  <button class="ib" id="setbtn" title="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
 </div>
 <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" type="search" placeholder="키워드 검색 (예: 스프링클러 수리계산)" autocomplete="off"><button id="qx" aria-label="지우기">×</button></div>
 <div class="row-scroll" id="chs"></div>
 <div class="row-scroll" id="cats"></div>
 <div class="tools"><span id="cnt"></span><span class="sp"></span>
  <label class="tg"><input type="checkbox" id="unseen"><i></i>안 본 것만</label>
  <label class="tg"><input type="checkbox" id="noshorts"><i></i>쇼츠 숨기기</label></div>
</div></header>
<main class="wrap" id="list"></main>

<div class="sheet-bg" id="sbg"></div>
<div class="sheet" id="sheet">
 <h2>설정</h2>
 <p>API 키는 이 브라우저에만 저장돼요. 같은 주소의 정보관리기술사 페이지에 넣은 키가 있으면 자동으로 함께 써요.</p>
 <label for="key">YouTube Data API 키</label>
 <input type="text" id="key" placeholder="AIza로 시작하는 키" autocomplete="off" spellcheck="false">
 <div class="btns"><button class="btn pri" id="keysave">저장하고 확인</button><button class="btn dan" id="keydel">키 삭제</button></div>
 <label>목록</label>
 <div class="btns"><button class="btn" id="exp">CSV로 저장</button><button class="btn" id="allseen">보이는 영상 모두 봤음</button><button class="btn dan" id="reset">목록 초기화</button></div>
 <div class="btns" style="justify-content:flex-end;margin-top:18px"><button class="btn" id="close">닫기</button></div>
</div>

<script>
const P='fire_'; // 이 페이지 전용 저장 키 접두사 (API 키 yt_key는 공용)
const CH=[
 {k:'pass',h:'@소방기술사패스',short:'소방기술사패스',pid:'UUiB-WwQjkv20u7ShNTTpR7Q',c:'#e8590c'},
 {k:'hqpea',h:'@HQPEA',short:'세짖말 설비특강',pid:'UUi8Pjv8BGF9p_9qL_U742MA',c:'#1c7ed6'},
 {k:'moa',h:'@모아소방TV',short:'모아 소방TV',pid:'UUXMNFxSIYQT3_gXobACrvHw',c:'#2f9e44'},
 {k:'kfire',h:'@K-FIRELEADER',short:'K-소방학원',pid:'UUoIBnLiJX1W9jsbvgfix6Qw',c:'#ae3ec9'},
 {k:'hosoon',h:'@hosoonsobangTV',short:'박호순 소방학원',pid:'UUOg7exLyenycJvp5kzsVDZA',c:'#f08c00'},
 {k:'midong',h:'@미동소방학원',short:'미동소방학원',pid:'UU2GYi495vOD4AriqaKCMjMw',c:'#0ca678'},
 // 따다: 여러 자격증을 다루는 채널이라 소방 관련 제목만 담음 (only 줄을 지우면 전체 영상)
 {k:'ddada',h:'@DDaDa-edu',short:'따다',pid:'UUkPZ5y87CvVedMvsc4uN0YQ',c:'#d6336c',only:/소방|화재|방재|피난|제연|소화|스프링클러|위험물|연소|폭발|방화/}
];
const DAYS=92, PAGE=60;
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const J=(k,d)=>{try{return JSON.parse(LS.get(k)||'null')??d}catch(e){return d}};
CH.forEach(c=>{const s=J(P+'ch_'+c.k,null);c.data=s&&Array.isArray(s.d)?s.d:[];c.full=!!(s&&s.full)});
const save=c=>LS.set(P+'ch_'+c.k,JSON.stringify({d:c.data,full:c.full}));
let seen=new Set(J(P+'seen',[]));const saveSeen=()=>LS.set(P+'seen',JSON.stringify([...seen]));
const st={ch:LS.get(P+'cur')||'all',cat:'전체',limit:PAGE};

// 소방기술사 과목 자동 분류 (제목 키워드, 위에서부터 먼저 맞는 것)
const RULES=[
 ['라이브',/라이브|LIVE|생방|실시간/i],
 ['기출풀이',/\d{2,3}\s*회.*(기출|문제|풀이|해설|분석)|기출/],
 ['합격·학습전략',/합격|수기|공부법|학습법|전략|설명회|후기|면접|답안\s*작성|작성법|오리엔테이션|\bOT\b|커리큘럼|로드맵/i],
 ['법규·기준',/법령|법규|NFPC|NFTC|화재안전기준|화재안전성능|화재안전기술|고시|개정|시행령|시행규칙|소방시설법|건축법|다중이용/i],
 ['화재역학·연소',/화재역학|연소|플래시\s*오버|백\s*드래프트|열방출|HRR|화재\s*성장|화염|폭발|발화|열전달|복사열|대류|전도|연기\s*생성|플룸|ceiling\s*jet/i],
 ['소방유체·수리',/유체|수리\s*계산|수리|펌프|배관|마찰\s*손실|수격|캐비테이션|공동현상|베르누이|하젠|NPSH|양정|유량|압력\s*손실/i],
 ['제연·피난·건축방재',/제연|배연|급기|가압|피난|방화\s*구획|내화|건축\s*방재|방재|성능\s*위주|PBD|RSET|ASET|피난\s*시뮬|FDS|방화문|방화셔터/i],
 ['소화설비',/스프링클러|소화|포\s*소화|가스계|할론|이산화탄소|CO2|청정|미분무|옥내\s*소화전|옥외\s*소화전|물분무|드렌처|헤드|송수구|수원/i],
 ['경보·전기설비',/자동\s*화재\s*탐지|자탐|감지기|비상\s*방송|유도등|비상\s*조명|비상\s*전원|전기|수신기|발신기|누전|무선통신|비상\s*콘센트|R형|P형/i],
 ['위험물·화학·신산업',/위험물|가스|화학|분진|LNG|LPG|수소|배터리|ESS|리튬|전기차|데이터\s*센터|반도체|지하\s*공동구|터널/i],
 ['소방기계·일반',/소방\s*기계|기계|소방\s*시설|점검|관리|감리|설계|시공/]
];
const cat=t=>{for(const[n,r]of RULES)if(r.test(t))return n;return'기타'};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/[\s·・\-_()（）\[\]]/g,'');
const chOf=k=>CH.find(c=>c.k===k);
const kdate=p=>new Date(new Date(p).getTime()+9*3600e3);
const ymd=p=>kdate(p).toISOString().slice(0,10);
const ago=p=>{const s=(Date.now()-new Date(p))/1e3;if(s<3600)return Math.max(1,Math.floor(s/60))+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';const d=Math.floor(s/86400);if(d<7)return d+'일 전';if(d<35)return Math.floor(d/7)+'주 전';return Math.floor(d/30)+'개월 전'};
const fmtDur=s=>{if(!s&&s!==0)return'';const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const isoDur=d=>{const m=(d||'').match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);return m?((+m[1]||0)*86400+(+m[2]||0)*3600+(+m[3]||0)*60+(+m[4]||0)):null};
const isShort=v=>v.s!=null&&v.s<=180&&/#shorts|쇼츠/i.test(v.t)||v.s!=null&&v.s<=60;
function section(p){const d=kdate(p),n=kdate(new Date().toISOString());const dd=Math.floor((Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())-Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))/864e5);
 if(dd<=0)return'오늘';if(dd===1)return'어제';if(dd<7)return'이번 주';if(dd<14)return'지난주';return(d.getUTCFullYear()!==n.getUTCFullYear()?d.getUTCFullYear()+'년 ':'')+(d.getUTCMonth()+1)+'월'}

function pool(){return st.ch==='all'?CH.flatMap(c=>c.data.map(v=>(v.ch=c.k,v))):chOf(st.ch).data.map(v=>(v.ch=st.ch,v))}
function filtered(){const ws=document.getElementById('q').value.trim().split(/\s+/).filter(Boolean).map(norm);
 const us=document.getElementById('unseen').checked,ns=document.getElementById('noshorts').checked;
 return pool().filter(v=>(st.cat==='전체'||(st.cat==='NEW'?v.n:v.c===st.cat))&&(!us||!seen.has(v.id))&&(!ns||!isShort(v))&&ws.every(w=>norm(v.t).includes(w)))
  .sort((a,b)=>b.p.localeCompare(a.p))}
function drawChs(){const el=document.getElementById('chs');const all=CH.reduce((s,c)=>s+c.data.length,0);
 el.innerHTML=[`<button class="chip${st.ch==='all'?' on':''}" data-k="all">전체<span class="n">${all}</span></button>`,
 ...CH.map(c=>`<button class="chip${st.ch===c.k?' on':''}" data-k="${c.k}"><span class="dot" style="background:${c.c}"></span>${esc(c.short)}<span class="n">${c.data.length}</span></button>`)].join('');
 el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.ch=b.dataset.k;LS.set(P+'cur',st.ch);st.cat='전체';st.limit=PAGE;drawAll()})}
function drawCats(){const L=pool(),cnt={};L.forEach(v=>cnt[v.c]=(cnt[v.c]||0)+1);const nn=L.filter(v=>v.n).length;
 const order=[...RULES.map(r=>r[0]),'기타'].filter(n=>cnt[n]);
 document.getElementById('cats').innerHTML=['전체',...(nn?['NEW']:[]),...order].map(c=>`<button class="chip${st.cat===c?' on':''}" data-c="${c}">${c==='전체'?'모든 과목':c==='NEW'?'새 영상':esc(c)}<span class="n">${c==='전체'?L.length:c==='NEW'?nn:cnt[c]}</span></button>`).join('');
 document.querySelectorAll('#cats .chip').forEach(b=>b.onclick=()=>{st.cat=b.dataset.c;st.limit=PAGE;drawCats();render()})}
function render(){const raw=document.getElementById('q').value.trim();document.getElementById('qx').style.display=raw?'block':'none';
 const ws=raw.split(/\s+/).filter(Boolean),L=filtered(),list=document.getElementById('list');
 document.getElementById('cnt').textContent=`${L.length}개`;
 if(!L.length){list.innerHTML=pool().length?'<div class="empty"><b>찾는 영상이 없어요</b>검색어나 필터를 바꿔 보세요.</div>':
  `<div class="empty"><b>아직 목록이 없어요</b>${LS.get('yt_key')?'오른쪽 위 새로고침 버튼을 눌러 주세요.':'오른쪽 위 ⚙ 설정에서 YouTube API 키를 넣으면<br>7개 채널의 최근 3개월 영상을 불러와요.'}</div>`;return}
 const re=ws.length?new RegExp('('+ws.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'):null;
 let html='',sec='',open=false;
 L.slice(0,st.limit).forEach(v=>{const s=section(v.p);if(s!==sec){if(open)html+='</div>';html+=`<div class="sec">${s}</div><div class="grid">`;sec=s;open=true}
  const c=chOf(v.ch);let t=esc(v.t);if(re)t=t.replace(re,'<mark>$1</mark>');const url='https://www.youtube.com/watch?v='+v.id;
  html+=`<article class="card${seen.has(v.id)?' is-seen':''}" data-id="${v.id}"><a class="th" href="${url}" target="_blank" rel="noopener"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="">${v.s!=null?`<span class="dur">${fmtDur(v.s)}</span>`:''}${v.n?'<span class="newb">NEW</span>':''}</a>
  <button class="seen" title="봤어요 표시"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  <div class="cb"><a class="t" href="${url}" target="_blank" rel="noopener">${t}</a><div class="meta"><span class="ch"><span class="dot" style="background:${c.c}"></span>${esc(c.short)}</span>·<span title="${ymd(v.p)}">${ago(v.p)}</span><span class="cat">${esc(v.c)}</span></div></div></article>`});
 if(open)html+='</div>';if(L.length>st.limit)html+=`<button class="more" id="more">더 보기 (${L.length-st.limit}개 남음)</button>`;
 list.innerHTML=html;const m=document.getElementById('more');if(m)m.onclick=()=>{st.limit+=PAGE*2;render()}}
document.getElementById('list').addEventListener('click',e=>{const card=e.target.closest('.card');if(!card)return;const id=card.dataset.id;
 if(e.target.closest('.seen')){seen.has(id)?seen.delete(id):seen.add(id);saveSeen();card.classList.toggle('is-seen',seen.has(id));e.preventDefault();return}
 if(e.target.closest('a')){seen.add(id);saveSeen();setTimeout(()=>card.classList.add('is-seen'),300)}});
function drawAll(){drawChs();drawCats();render()}
let qt;document.getElementById('q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>{st.limit=PAGE;render()},120)});
document.getElementById('qx').onclick=()=>{document.getElementById('q').value='';render();document.getElementById('q').focus()};
['unseen','noshorts'].forEach(id=>{const el=document.getElementById(id);el.checked=LS.get(P+id)==='1';el.onchange=()=>{LS.set(P+id,el.checked?'1':'0');st.limit=PAGE;render()}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('q').focus()}});
const view=()=>document.body.classList.toggle('list',LS.get(P+'view')==='list');view();
document.getElementById('viewbtn').onclick=()=>{LS.set(P+'view',LS.get(P+'view')==='list'?'grid':'list');view()};

// ---- 동기화 ----
const stEl=document.getElementById('st');const status=(m,c)=>{stEl.textContent=m;stEl.className=c||''};
const API='https://www.googleapis.com/youtube/v3/';
async function api(path,key){const j=await (await fetch(API+path+'&key='+encodeURIComponent(key))).json();
 if(j.error)throw new Error((j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason||'')+' '+String(j.error.message).replace(/<[^>]+>/g,''));return j}
async function pidOf(c,key){const ck=LS.get(P+'pid_'+c.k);if(ck)return ck;
 try{const j=await api(`channels?part=contentDetails&forHandle=${encodeURIComponent(c.h)}`,key);const u=j.items&&j.items[0]&&j.items[0].contentDetails.relatedPlaylists.uploads;if(u){LS.set(P+'pid_'+c.k,u);return u}}catch(e){}
 return c.pid}
async function syncCh(c,key){const PL=await pidOf(c,key);const known=new Map(c.data.map(v=>[v.id,v]));const empty=!known.size;
 const cutoff=new Date(Date.now()-DAYS*864e5).toISOString();const got=[];let tok='',pages=0;
 do{const j=await api(`playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${PL}`+(tok?`&pageToken=${tok}`:''),key);
  let hit=false,old=false;for(const it of j.items||[]){const t=it.snippet.title;if(/^(Private|Deleted) video$/.test(t))continue;
   const p=it.contentDetails.videoPublishedAt||it.snippet.publishedAt;got.push({id:it.contentDetails.videoId,t,p});if(known.has(it.contentDetails.videoId))hit=true;if(p<cutoff)old=true}
  tok=j.nextPageToken||'';pages++;if(empty?old:hit)break}while(tok&&pages<40);
 let last=-1;got.forEach((g,i)=>{if(known.has(g.id))last=i});if(!empty&&last<0)last=got.length-1;
 c.data.forEach(v=>{if(v.n&&Date.now()-v.n>7*864e5)delete v.n});let added=0;
 got.forEach((g,i)=>{const v=known.get(g.id);if(v){v.t=g.t;v.p=g.p;v.c=cat(g.t)}
  else if((empty?g.p>=cutoff:i<=last)&&(!c.only||c.only.test(g.t))){const nv={id:g.id,t:g.t,p:g.p,c:cat(g.t)};if(!empty){nv.n=Date.now();added++}c.data.push(nv);known.set(g.id,nv)}});
 // 영상 길이(쇼츠 구분용): 50개씩 1단위
 const need=c.data.filter(v=>v.s==null).map(v=>v.id);
 for(let i=0;i<need.length;i+=50){try{const j=await api(`videos?part=contentDetails&id=${need.slice(i,i+50).join(',')}`,key);
  (j.items||[]).forEach(it=>{const v=known.get(it.id);if(v)v.s=isoDur(it.contentDetails.duration)})}catch(e){break}}
 c.data.sort((a,b)=>b.p.localeCompare(a.p));c.full=true;save(c);return{c,added,loaded:empty?c.data.length:0}}
let busy=false;
async function sync(){if(busy)return;const key=LS.get('yt_key');
 if(!key){status('⚙ 설정에서 API 키를 넣어 주세요.','err');return}
 if(!navigator.onLine){status('오프라인 · 저장된 목록으로 검색만 돼요');return}
 busy=true;document.getElementById('syncbtn').classList.add('spin');status('새 영상 확인 중…');
 const res=[],errs=[];
 await Promise.all(CH.map(async c=>{try{res.push(await syncCh(c,key))}catch(e){errs.push(c.short+': '+e.message.trim())}}));
 busy=false;document.getElementById('syncbtn').classList.remove('spin');
 const add=res.reduce((s,r)=>s+r.added,0),ld=res.reduce((s,r)=>s+r.loaded,0);
 LS.set(P+'last',new Date().toISOString());if(add&&st.cat==='전체')st.cat='NEW';drawAll();
 if(errs.length)status('확인 실패 — '+errs.join(' / '),'err');
 else status(`방금 확인 · `+(ld?`${ld}개 불러옴`:add?`새 영상 ${add}개`:'새 영상 없음'),add||ld?'ok':'')}
document.getElementById('syncbtn').onclick=sync;

// ---- 설정 ----
const sheet=o=>{document.getElementById('sheet').classList.toggle('open',o);document.getElementById('sbg').classList.toggle('open',o);if(o)document.getElementById('key').value=LS.get('yt_key')||''};
document.getElementById('setbtn').onclick=()=>sheet(true);document.getElementById('close').onclick=document.getElementById('sbg').onclick=()=>sheet(false);
document.getElementById('keysave').onclick=()=>{const k=document.getElementById('key').value.trim();if(!k)return;LS.set('yt_key',k);sheet(false);sync()};
document.getElementById('keydel').onclick=()=>{LS.del('yt_key');document.getElementById('key').value='';status('API 키를 삭제했어요.')};
document.getElementById('allseen').onclick=()=>{filtered().forEach(v=>seen.add(v.id));saveSeen();sheet(false);render()};
document.getElementById('reset').onclick=()=>{const b=document.getElementById('reset');if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='한 번 더 누르면 초기화';return}
 CH.forEach(c=>{c.data=[];c.full=false;LS.del(P+'ch_'+c.k)});b.dataset.c='';b.textContent='목록 초기화';sheet(false);drawAll();sync()};
document.getElementById('exp').onclick=()=>{const rows=filtered().map(v=>[chOf(v.ch).short,v.t,'https://www.youtube.com/watch?v='+v.id,ymd(v.p),v.c,fmtDur(v.s),seen.has(v.id)?'O':'']);
 const csv='﻿'+[['채널','제목','주소','업로드일','과목','길이','봤음'],...rows].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='소방기술사_영상목록.csv';a.click()};

drawAll();
const last=LS.get(P+'last');status(last?`마지막 확인 ${ago(last)}`:(LS.get('yt_key')?'확인 중…':'⚙ 설정에서 API 키를 넣어 주세요'));
if(LS.get('yt_key'))sync();
</script>
</body></html>
